<!-- HEADER AVEC AVATAR -->
<app-settings-header [user]="user"></app-settings-header>

<div class="settings-container container py-5">

  <!-- PROFIL -->
  <div class="settings-card glass-card mb-4">
    <div class="card-header border-0 bg-transparent">
      <h2 class="section-title"><i class="bi bi-person-circle me-2"></i> Informations Personnelles</h2>
      <p class="section-subtitle">Gérez vos informations visibles dans l'annuaire</p>
    </div>
    <div class="card-body">
      <form [formGroup]="profileForm" (ngSubmit)="saveChanges()" class="form-modern">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Identifiant IP</label>
            <input type="text" class="form-control modern-input" formControlName="ip">
          </div>
          <div class="col-md-6">
            <label class="form-label">Numéro téléphone</label>
            <input type="text" class="form-control modern-input" formControlName="telephone">
          </div>
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control modern-input" formControlName="nom" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control modern-input" formControlName="prenom" readonly>
          </div>
          <div class="col-12">
            <label class="form-label">Adresse Email</label>
            <input type="email" class="form-control modern-input" formControlName="email" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Poste</label>
            <input type="text" class="form-control modern-input" formControlName="poste" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Direction</label>
            <input type="text" class="form-control modern-input" formControlName="direction" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Service</label>
            <input type="text" class="form-control modern-input" formControlName="service" readonly>
          </div>
        </div>
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-gradient">Enregistrer les modifications</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SÉCURITÉ -->
  <div class="settings-card glass-card">
    <div class="card-header border-0 bg-transparent">
      <h2 class="section-title"><i class="bi bi-shield-lock-fill me-2"></i> Sécurité</h2>
      <p class="section-subtitle">Gérez la sécurité de votre compte</p>
    </div>
    <div class="card-body">
      <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="form-modern">
        <div class="input-wrapper mb-3">
          <label class="form-label">Mot de passe actuel</label>
          <input type="password" class="form-control modern-input" formControlName="current">
        </div>
        <div class="input-wrapper mb-3">
          <label class="form-label">Nouveau mot de passe</label>
          <input type="password" class="form-control modern-input" formControlName="new">
        </div>
        <div class="input-wrapper mb-3">
          <label class="form-label">Confirmer le mot de passe</label>
          <input type="password" class="form-control modern-input" formControlName="confirm">
          <div *ngIf="passwordForm.errors?.['mismatch']" class="text-danger mt-1">
            Les mots de passe ne correspondent pas
          </div>
        </div>
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-gradient">Mettre à jour le mot de passe</button>
        </div>
      </form>
    </div>
  </div>
</div>
