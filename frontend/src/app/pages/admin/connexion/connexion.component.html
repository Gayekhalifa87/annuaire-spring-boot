<div class="text-end">
  <button class="btn btn-light d-flex align-items-center gap-1" (click)="back()">
    <i class="bi bi-arrow-left"></i> Retour
  </button>
</div>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔒</div>
      <h1 class="login-title">Administration</h1>
      <p class="login-subtitle">Connectez-vous pour accéder au panneau d'administration</p>
    </div>

    <form [formGroup]="connexionForm" (ngSubmit)="onLogin()">
      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <div class="input-wrapper">
          <input type="email" class="input-modern" formControlName="email" placeholder="votre.email@exemple.com">
        </div>
        <div *ngIf="emailErrorMessage" class="error-message">{{ emailErrorMessage }}</div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" class="input-modern" formControlName="password" placeholder="Votre mot de passe">
          <i class="fa-solid toggle-icon" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'" (click)="togglePassword()"></i>
        </div>
        <div *ngIf="passwordErrorMessage" class="error-message">{{ passwordErrorMessage }}</div>
      </div>

      <button type="submit" class="login-button" [disabled]="connexionForm.invalid || isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <div *ngIf="message" class="server-message">{{ message }}</div>

      <a class="forgot-link" (click)="forgot(); $event.preventDefault()">Mot de passe oublié ?</a>
    </form>
  </div>
</div>
